name: Gerar Release Automático

on:
  push:
    tags:
      - 'v*' # Dispara ao criar tags como v0.4.4

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Preparar Pacote do Plugin (Estilo build.py)
        run: |
          PLUGIN_NAME="vector_to_map"
          
          # 1. Cria uma pasta temporária para receber os arquivos
          mkdir temp_build
          
          # 2. Copia TUDO do repositório para a pasta temporária, exceto o lixo de desenvolvimento.
          # Isso garante que as 6 pastas do Sentry, templates e qualquer futura biblioteca sejam incluídas automaticamente!
          rsync -av ./ temp_build/ \
            --exclude=".git/" \
            --exclude=".github/" \
            --exclude="temp_build/" \
            --exclude="__pycache__/" \
            --exclude="*.pyc" \
            --exclude="*.ts" \
            --exclude="*.html" \
            --exclude=".gitignore" \
            --exclude="build.py" \
            --exclude="pb_tool.cfg" \
            --exclude="resources.qrc" \
            --exclude="*.zip"
          
          # 3. Renomeia a pasta temporária para o nome oficial do plugin exigido pelo QGIS
          mv temp_build "$PLUGIN_NAME"
          
          # 4. Gera o ZIP final perfeito
          zip -r "${PLUGIN_NAME}.zip" "$PLUGIN_NAME"

      - name: Criar Release no GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: vector_to_map.zip
          name: Release ${{ github.ref_name }}
          body: |
            ### 🗺️ VectorToMap ${{ github.ref_name }}
            Nova versão gerada automaticamente via GitHub Actions.

            🎉 **ALL PRO FEATURES ARE NOW 100% FREE AND OPEN-SOURCE!** 🎉
            
            ### 🚀 New Features & Improvements
            * **Robust XML Template Parsing:** Implemented `QDomDocument` to automatically sanitize custom `.qpt` templates, cleaning up corrupted files and removing "ghost" maps before loading.
            * **Smart CRS Reprojection:** Added a robust fallback mechanism (`QgsCsException` protection) to prevent crashes when projecting geometries outside the domain.
            * **Batch Export Optimization:** Drastically improved export speed and memory stability for massive datasets using UI event throttling and advanced Garbage Collection (`gc.collect()`).
            * **Sentry Integration:** Added optional and anonymous automatic crash reporting to continuously track and improve plugin stability.

            ### 🐛 Bug Fixes & Optimizations
            * **UI Signal Protection:** Fortified interface event handling using `try...finally` blocks to completely eliminate UI freezes and lockups.
            * **Removed Cascade Effects:** Cleaned up duplicate signal triggers and redundant translations, making the plugin launch faster and preventing double map rendering.
            * **Safe Memory Deletion:** Fixed potential QGIS crashes (Segmentation Faults) by replacing UI layout hacks with the official Qt `deleteLater()` method for cleanup.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}