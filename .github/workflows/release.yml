name: Gerar Release Automático (DevSecOps)

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  sast_scan:
    name: Análise Estática e Segurança
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar Ferramentas SAST
        run: pip install -r requirements.txt

      - name: Checagem de Qualidade de Código (Ruff)
        run: ruff check .

      - name: Varredura de Segurança (Bandit)
        run: bandit -r . -x ./tests,./venv,./temp_build -ll

  integration_tests:
    name: Testes no QGIS (${{ matrix.qgis_version }})
    needs: sast_scan
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        qgis_version: ['latest', 'ltr']

    container:
      image: qgis/qgis:${{ matrix.qgis_version }}

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Instalar Dependências de Teste e Display Virtual
        run: |
          apt-get update
          apt-get install -y xvfb python3-pytest

      - name: Preparar Ambiente QGIS
        run: |
          mkdir -p /root/.local/share/QGIS/QGIS3/profiles/default/python/plugins/vector_to_map
          cp -r ./* /root/.local/share/QGIS/QGIS3/profiles/default/python/plugins/vector_to_map/

      - name: Executar Suite de Testes
        run: xvfb-run -a pytest tests/ -v

  build:
    name: Empacotamento e Publicação
    needs: integration_tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Injetar Segredos de CI
        run: sed -i "s|INSERIR_DSN_VIA_CI_AQUI|${{ secrets.SENTRY_DSN }}|g" vector_to_map.py

      - name: Criar Release no GitHub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view ${{ github.ref_name }} || gh release create ${{ github.ref_name }} --title "VectorToMap ${{ github.ref_name }}" --generate-notes

      - name: Instalar Dependências de Deploy
        run: pip install qgis-plugin-ci

      - name: Estruturar Pacote para OSGeo
        run: |
          rm -rf tests/ temp_build/ *.dist-info/ i18n/*.ts .github/ build.py pb_tool.cfg .qgisignore .gitignore

          # O NOME DA PASTA DEVE SER O NOME EXATO DO PACOTE PYTHON (MINÚSCULO)
          mkdir vector_to_map

          find . -maxdepth 1 ! -name '.' ! -name '.git' ! -name 'vector_to_map' -exec mv {} vector_to_map/ \;
          mv vector_to_map/pyproject.toml .

          # Atualiza o TOML apontando para a pasta minúscula
          sed -i 's|plugin_path = "."|plugin_path = "vector_to_map"|g' pyproject.toml

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "ci: corrige o nome da pasta do pacote para dar update no plugin correto"

      - name: Publicar no Repositório QGIS
        env:
          SECURE_USER: ${{ secrets.OSGEO_USERNAME }}
          SECURE_PASS: ${{ secrets.OSGEO_PASSWORD }}
        run: |
          VERSION_LIMPA="${GITHUB_REF_NAME#v}"
          qgis-plugin-ci release $VERSION_LIMPA --osgeo-username "$SECURE_USER" --osgeo-password "$SECURE_PASS" --allow-uncommitted-changes

      - name: Anexar Artefato no GitHub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ github.ref_name }} *.zip --clobber