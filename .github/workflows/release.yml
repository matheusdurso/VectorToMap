name: Gerar Release Automático (DevSecOps)

on:
  push:
    tags:
      - 'v*' # Dispara ao criar tags como v0.4.4

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  sast_scan:
    name: Análise Estática e Segurança
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar Ferramentas SAST
        run: pip install ruff bandit

      - name: Checagem de Qualidade de Código (Ruff)
        # O "|| true" permite que o pipeline continue mesmo se o Ruff der avisos de formatação
        run: ruff check . || true

      - name: Varredura de Segurança (Bandit)
        # Verifica falhas lógicas e de injeção, ignorando pastas irrelevantes
        run: bandit -r . -x ./tests,./venv,./temp_build -ll
  
  integration_tests:
    name: Testes Automatizados no QGIS
    needs: sast_scan # Só testa se passar no SAST
    runs-on: ubuntu-latest
    
    # Roda tudo dentro do Docker oficial do QGIS!
    container:
      image: qgis/qgis:latest 
      
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Instalar Dependências de Teste e Display Virtual
        run: |
          apt-get update
          # Xvfb é o monitor virtual. Pytest é o motor de testes.
          apt-get install -y xvfb python3-pytest 

      - name: Preparar Ambiente QGIS
        run: |
          # Simula a pasta de plugins do QGIS dentro do Docker
          mkdir -p /root/.local/share/QGIS/QGIS3/profiles/default/python/plugins/vector_to_map
          cp -r ./* /root/.local/share/QGIS/QGIS3/profiles/default/python/plugins/vector_to_map/

      - name: Executar Suite de Testes (Pytest Headless)
        run: |
          # xvfb-run cria a tela falsa e executa o pytest na sua pasta de testes
          xvfb-run -a pytest tests/ -v

  build:
    name: Empacotamento Seguro
    needs: integration_tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Injetar Segredos DevSecOps
        run: |
          # Substitui o placeholder no código pela chave real do GitHub Secrets
          sed -i "s|INSERIR_DSN_VIA_CI_AQUI|${{ secrets.SENTRY_DSN }}|g" vector_to_map.py

      - name: Preparar Pacote do Plugin
        run: |
          PLUGIN_NAME="vector_to_map"
          
          mkdir temp_build
          
          rsync -av ./ temp_build/ \
            --exclude=".git/" \
            --exclude=".github/" \
            --exclude="temp_build/" \
            --exclude="__pycache__/" \
            --exclude="*.pyc" \
            --exclude="*.ts" \
            --exclude="*.html" \
            --exclude=".gitignore" \
            --exclude="build.py" \
            --exclude="pb_tool.cfg" \
            --exclude="resources.qrc" \
            --exclude="*.zip"
          
          mv temp_build "$PLUGIN_NAME"
          zip -r "${PLUGIN_NAME}.zip" "$PLUGIN_NAME"

      - name: Criar Release no GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: vector_to_map.zip
          name: Release ${{ github.ref_name }}
          body: |
            ### 🗺️ VectorToMap ${{ github.ref_name }}
            Nova versão gerada e verificada automaticamente via Pipeline DevSecOps.

            🎉 **ALL PRO FEATURES ARE NOW 100% FREE AND OPEN-SOURCE!** 🎉
            
            ### 🚀 DevSecOps & Security
            * **Automated Security Scanning:** Implemented SAST (Bandit/Ruff) checks directly into the CI/CD pipeline.
            * **PII Sanitization:** Added Regex-based masking for sensitive geographic and personal data (CPF, Emails) before telemetries.
            * **Secrets Management:** Sentry DSNs are now securely injected during build via GitHub Actions.

            ### 🚀 New Features & Improvements
            * **Robust XML Template Parsing:** Implemented `QDomDocument` to automatically sanitize custom `.qpt` templates.
            * **Smart CRS Reprojection:** Added a robust fallback mechanism (`QgsCsException` protection).
            * **Batch Export Optimization:** Drastically improved export speed and memory stability.

            ### 🐛 Bug Fixes & Optimizations
            * **UI Signal Protection:** Fortified interface event handling using `try...finally` blocks.
            * **Removed Cascade Effects:** Cleaned up duplicate signal triggers.
            * **Safe Memory Deletion:** Fixed potential QGIS crashes using official Qt `deleteLater()`.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}