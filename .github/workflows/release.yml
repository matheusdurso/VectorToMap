name: Gerar Release Automático (DevSecOps)

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  sast_scan:
    name: Análise Estática e Segurança
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar Ferramentas SAST
        run: pip install -r requirements.txt

      - name: Checagem de Qualidade de Código (Ruff)
        run: ruff check .

      - name: Varredura de Segurança (Bandit)
        run: bandit -r . -x ./tests,./venv,./temp_build -ll

  integration_tests:
    name: Testes no QGIS (${{ matrix.qgis_version }})
    needs: sast_scan
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        qgis_version: ['latest', 'ltr']

    container:
      image: qgis/qgis:${{ matrix.qgis_version }}

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Instalar Dependências de Teste e Display Virtual
        run: |
          apt-get update
          apt-get install -y xvfb python3-pytest

      - name: Preparar Ambiente QGIS
        run: |
          mkdir -p /root/.local/share/QGIS/QGIS3/profiles/default/python/plugins/vector_to_map
          cp -r ./* /root/.local/share/QGIS/QGIS3/profiles/default/python/plugins/vector_to_map/

      - name: Executar Suite de Testes (Pytest Headless)
        run: |
          xvfb-run -a pytest tests/ -v

  build:
    name: Empacotamento Seguro e Publicação
    needs: integration_tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Injetar Segredos DevSecOps
        run: |
          sed -i "s|INSERIR_DSN_VIA_CI_AQUI|${{ secrets.SENTRY_DSN }}|g" vector_to_map.py

      - name: Criar Release Oficial no GitHub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view ${{ github.ref_name }} || gh release create ${{ github.ref_name }} --title "VectorToMap ${{ github.ref_name }}" --generate-notes

      - name: Instalar qgis-plugin-ci
        run: pip install qgis-plugin-ci

      # --- DELEÇÃO CIRÚRGICA ANTES DO EMPACOTAMENTO ---
      - name: Limpar Arquivos Pesados do Runner (Reduzir ZIP)
        run: |
          rm -rf tests/
          rm -rf temp_build/
          rm -rf *.dist-info/
          rm -rf i18n/*.ts
          rm -rf .github/
          rm -f build.py pb_tool.cfg .qgisignore .gitignore

      - name: Empacotar e Enviar para a OSGeo
        run: >
          qgis-plugin-ci
          release ${{ github.ref_name }}
          --osgeo-username ${{ secrets.OSGEO_USERNAME }}
          --osgeo-password ${{ secrets.OSGEO_PASSWORD }}
          --allow-uncommitted-changes

      - name: Anexar o .zip na Release do GitHub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ github.ref_name }} *.zip --clobber