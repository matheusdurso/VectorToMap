name: Gerar Release Automático

on:
  push:
    tags:
      - 'v*' # Dispara ao criar tags como v0.4.4

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Preparar Pacote do Plugin (Estilo build.py)
        run: |
          PLUGIN_NAME="vector_to_map"
          
          # 1. Cria uma pasta temporária para receber os arquivos
          mkdir temp_build
          
          # 2. Copia TUDO do repositório para a pasta temporária, exceto o lixo de desenvolvimento.
          # Isso garante que as 6 pastas do Sentry, templates e qualquer futura biblioteca sejam incluídas automaticamente!
          rsync -av ./ temp_build/ \
            --exclude=".git/" \
            --exclude=".github/" \
            --exclude="temp_build/" \
            --exclude="__pycache__/" \
            --exclude="*.pyc" \
            --exclude="*.ts" \
            --exclude="*.html" \
            --exclude=".gitignore" \
            --exclude="build.py" \
            --exclude="*.zip"
          
          # 3. Renomeia a pasta temporária para o nome oficial do plugin exigido pelo QGIS
          mv temp_build "$PLUGIN_NAME"
          
          # 4. Gera o ZIP final perfeito
          zip -r "${PLUGIN_NAME}.zip" "$PLUGIN_NAME"

      - name: Criar Release no GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: vector_to_map.zip
          name: Release ${{ github.ref_name }}
          body: |
            ### 🗺️ VectorToMap ${{ github.ref_name }}
            Nova versão gerada automaticamente via GitHub Actions.
            
            ### 🚀 New Features & Improvements
            * **Dynamic Labels in Templates:** Added support for dynamic attribute substitution in custom layouts (`.qpt`) using the `["Column_Name"]` syntax, along with native support for QGIS expressions (`[% %]`).
            * **New Overview Map Engine:** Users can now choose between a fixed global framing (via a selected layer) or a dynamic, relative Zoom Out from the main map (with options for 2x, 5x, 10x, 15x, 20x, and 25x).
            * **UI/UX Restructuring:** The Overview Map controls were isolated into an independent Checkable GroupBox (`group_mapa_loc`), ensuring a cleaner and more organized interface.
            * **Internationalization (i18n):** Complete review and update of UI translations for 7 languages (German, English, Spanish, French, Italian, Russian, and Chinese).

            ### 🐛 Bug Fixes & Optimizations
            * **Duplicate Window Prevention:** The plugin now properly manages its single instance. If the window is already open or minimized, the code simply brings it to the front and synchronizes the active layer, preventing clone windows from opening.
            * **Ghost Layers Exorcism:** Implemented a 100% secure active sweep using Custom Properties (`vtm_is_preview_temp`) to ensure no Preview layers get stuck in RAM or ComboBoxes if QGIS suffers a crash or an abrupt reload.
            * **UI Logic Leaks Fix:** Fixed a bug where UI signals would improperly reactivate elements in the decorations group when a Template (Preset) was selected or when the group was explicitly unchecked.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}